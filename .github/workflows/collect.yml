name: Collect market prices

# Kalshi blocks requests from Cloudflare's network, so the collector runs here and
# uploads to Cloudflare (R2 for cycle files, D1 for the races index and price history).
on:
  schedule:
    # every 5 minutes: GitHub often delays or drops scheduled runs, so asking twice as often keeps
    # real gaps near 10 minutes (runs take 1-2 minutes and never overlap; see concurrency)
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull Kalshi and Polymarket
        run: python3 ingest/ingest.py
      - name: Every other politics market (cabinet, courts, world leaders, mayors…)
        run: python3 ingest/politics.py || echo "politics fetch failed; keeping the previous board"
      - name: Recent Kalshi trades for the most active contracts
        run: python3 ingest/trades.py || echo "kalshi trades fetch failed; keeping the previous set"
      - name: Social pulse (LunarCrush, about once an hour)
        env:
          LUNARCRUSH_API_KEY: ${{ secrets.LUNARCRUSH_API_KEY }}
        run: python3 ingest/social.py || echo "social fetch failed; keeping the previous pulse"
      - name: Pull political headlines (Google News)
        run: python3 ingest/news.py || echo "news fetch failed; keeping the previous headlines"
      - name: Public polls from Wikipedia's race pages (every 6 hours)
        run: python3 ingest/polls.py || echo "polls fetch failed; keeping the previous polls"
      - name: Parlay estimates (hourly)
        run: python3 ingest/model/forecast.py || echo "forecast step failed"
      - name: Race results once the exchanges settle (hourly, after Election Day)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ece401f47370ecab76cbc85bf2a7054c
        run: python3 ingest/model/results.py || echo "results step failed"
      - name: Archive everything (snapshots, trades, volume, headlines, social)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ece401f47370ecab76cbc85bf2a7054c
        run: python3 ingest/archive.py || echo "archive step failed; prices still publish"
      - name: Refresh the AI analyst's research documents (every 6 hours)
        env:
          KNOWLEDGE_TOKEN: ${{ secrets.KNOWLEDGE_TOKEN }}
        run: |
          if [ $(( $(date -u +%H) % 6 )) -eq 1 ] && [ $(date -u +%M) -lt 10 ]; then
            curl -s -X POST -H "Authorization: Bearer $KNOWLEDGE_TOKEN" https://parlaythepeople.com/api/internal/knowledge || echo "knowledge refresh failed"
          fi
      - name: Publish to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ece401f47370ecab76cbc85bf2a7054c
        run: ./ingest/publish.sh
